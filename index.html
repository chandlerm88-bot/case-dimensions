<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case Dimension Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b; --ink-2:#3d4c5c; --ink-3:#6b7c8d;
  --paper:#eef1f4; --card:#ffffff; --line:#d4dbe2;
  --flag:#a4530b; --flag-bg:#fdf4e7; --flag-line:#e8c99a;
  --ok:#1f6b45; --ok-bg:#eaf3ee; --ok-line:#b9d6c6;
  --kraft:#b08d5f; --sel:#e6eef7; --blue:#255e8e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Barlow Semi Condensed',system-ui,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  background:var(--ink); color:#fff; padding:18px 22px 0;
  position:sticky; top:0; z-index:40;
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.htop{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;max-width:1500px;margin:0 auto}
h1{
  font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  margin:0;
}
.hsub{color:#93a6b8;font-size:14px}
/* ruler motif */
.ruler{
  max-width:1500px;margin:12px auto 0;height:9px;
  background-image:repeating-linear-gradient(to right,#4a5b6c 0 1px,transparent 1px 14px);
  background-position:bottom; background-repeat:repeat-x; opacity:.75;
}
nav{max-width:1500px;margin:0 auto;display:flex;gap:2px}
.tab{
  appearance:none;border:0;cursor:pointer;
  background:transparent;color:#93a6b8;
  font-family:inherit;font-size:15px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  padding:13px 20px 12px;border-bottom:3px solid transparent;
}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--kraft);background:rgba(255,255,255,.05)}
.tab .n{font-family:'IBM Plex Mono',monospace;font-size:13px;opacity:.8;margin-left:7px}

/* ---------- toolbar ---------- */
.note{background:#e4e9ee;border-bottom:1px solid var(--line);padding:8px 22px}
.notein{max-width:1500px;margin:0 auto;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.bar{
  position:sticky;top:var(--barTop,120px);z-index:30;
  background:rgba(238,241,244,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:11px 22px;
}
.barin{max-width:1500px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search],select{
  font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:7px 10px;
}
input[type=search]{min-width:230px}
input[type=search]:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
.btn{
  font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;cursor:pointer;border-radius:3px;
  padding:8px 15px;border:1px solid var(--ink);background:var(--ink);color:#fff;
}
.btn:hover:not(:disabled){background:#243547}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:#dde3ea}
.spacer{flex:1}
.count{font-size:14px;color:var(--ink-2)}
.count b{font-family:'IBM Plex Mono',monospace}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:18px 22px 90px}
.brand{margin-bottom:6px}
.bhead{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  padding:9px 12px;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--kraft);border-radius:3px;
  position:sticky;top:var(--brandTop,176px);z-index:12;
}
.bhead:hover{background:#f7f9fb}
.bhead h2{
  margin:0;font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
}
.chev{color:var(--ink-3);font-size:12px;width:12px;transition:transform .15s}
.brand.open .chev{transform:rotate(90deg)}
.bmeta{margin-left:auto;font-size:13px;color:var(--ink-3);display:flex;gap:14px;align-items:center}
.pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:2px 7px;border-radius:9px;border:1px solid;
}
.pill.f{color:var(--flag);background:var(--flag-bg);border-color:var(--flag-line)}
.pill.o{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.bbody{display:none;padding:4px 0 12px}
.brand.open .bbody{display:block}

.pack{margin:10px 0 0 14px;border-left:1px solid var(--line);padding-left:14px}
.phead{
  font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
  letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase;
  padding:6px 0 7px;display:flex;gap:10px;align-items:center;
}
.phead .fammed{color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none}

/* ---------- rows ---------- */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:3px}
thead th{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;background:#f7f9fb;
}
thead th.l{text-align:left}
tbody td{padding:7px 6px;border-bottom:1px solid #edf1f5;vertical-align:middle;text-align:center}
tbody tr:last-child td{border-bottom:0}
tbody tr.sel{background:var(--sel)}
tbody tr.moved{background:var(--ok-bg);animation:flash .9s ease-out}
@keyframes flash{from{background:#c9e6d5}to{background:var(--ok-bg)}}
td.l{text-align:left}
.desc{font-size:14px;line-height:1.3}
.pid{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-3)}
.badge{
  display:inline-block;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px;
}
.badge.noimg{background:#fdf4e7;color:var(--flag);border:1px solid var(--flag-line)}
.badge.dead{background:#f3eef3;color:#6b4a68;border:1px solid #d8c8d6;cursor:help}
.badge.slim{background:#eef2f6;color:#33566f;border:1px solid #c3d3e0;cursor:help}
.badge.pd{background:#f3eef3;color:#6b4a68;border:1px solid #d8c8d6;cursor:help}
.badge.voff{background:#fdf4e7;color:#a4530b;border:1px solid #e8c99a;cursor:help}
.badge.cube{background:#fbecec;color:#8f2f2f;border:1px solid #e3b8b8;cursor:help}
.badge.meas{background:#e7f3ec;color:#1f6b45;border:1px solid #b9d6c6;cursor:help}
.badge.asg{background:#eef4f9;color:#1e5b8a;border:1px solid #bcd3e6;cursor:help}
.pill.asg{background:#eef4f9;color:#1e5b8a;border:1px solid #bcd3e6}
#abar{position:sticky;top:0;z-index:60}
#abar>div{box-shadow:0 3px 10px rgba(15,25,35,.08)}
.badge.work{background:#fdf4e7;color:#a4530b;border:1px solid #e8c99a;cursor:help}
#loginwrap{position:fixed;inset:0;background:rgba(20,28,36,.55);z-index:200;display:flex;align-items:center;justify-content:center}
#loginwrap .box{background:#fff;border-radius:6px;padding:26px 30px;width:340px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#loginwrap input{width:100%;padding:9px 10px;font-size:15px;border:1px solid var(--line);border-radius:4px;margin:10px 0 14px}
.pwwrap{position:relative}
.pwwrap input{padding-right:38px;margin-top:-6px}
.eyebtn{position:absolute;right:8px;top:50%;transform:translateY(-62%);border:0;background:none;cursor:pointer;color:var(--ink-3);padding:4px}
.eyebtn:hover{color:var(--ink)}
.pat{font-size:12px;color:var(--ink-2);line-height:1.3}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}
.conf.high{background:var(--ok)} .conf.medium{background:var(--kraft)} .conf.low{background:#b0bcc7}

.cur{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-3)}
.cur.bad{color:var(--flag);text-decoration:line-through;text-decoration-thickness:1px}
input.dim{
  font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;
  width:64px;text-align:center;padding:5px 4px;
  border:1px solid var(--line);border-radius:3px;background:#fff;color:var(--ink);
}
input.dim.suggested{background:var(--flag-bg);border-color:var(--flag-line);font-weight:600;color:var(--flag)}
input.dim.edited{background:#e8f0f7;border-color:#bcd3e6;color:var(--blue);font-weight:600}
input.dim:focus{outline:2px solid var(--blue);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer}

/* ---------- hover card ---------- */
.ref{position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:19px;height:19px;border-radius:50%;border:1px solid var(--line);
  background:#f7f9fb;color:var(--ink-3);font-size:11px;font-weight:700;cursor:help}
.ref:hover,.ref:focus{border-color:var(--blue);color:var(--blue);outline:none}
.card{
  display:none;position:absolute;right:0;top:26px;width:290px;z-index:60;
  background:var(--ink);color:#e7edf3;border-radius:4px;padding:11px 13px;
  box-shadow:0 8px 26px rgba(12,20,28,.32);text-align:left;font-size:13px;
}
.ref:hover .card,.ref:focus .card{display:block}
.fixname{position:relative;cursor:help;border-bottom:1px dashed var(--line)}
.fixname .card{left:0;right:auto;top:22px;width:360px}
.fixname:hover .card,.fixname:focus .card{display:block}
.cubes{display:flex;gap:14px;align-items:flex-end;justify-content:space-between}
.cubes figure{margin:0;text-align:center;flex:1}
.cubes figcaption{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8fa3b6;margin-top:6px}
.cubes .cdim{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#cdd8e2;margin-top:2px}
.card .ct{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8fa3b6;margin-bottom:5px}
.card .cd{font-size:13.5px;line-height:1.3;margin-bottom:8px}
.card .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.card .cg div span{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#8fa3b6}
.card .cg div b{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:500}
.card .cn{margin-top:8px;padding-top:7px;border-top:1px solid #2f4053;font-size:12px;color:#93a6b8;line-height:1.35}

.empty{text-align:center;padding:70px 20px;color:var(--ink-3)}
.empty b{display:block;font-size:19px;color:var(--ink-2);margin-bottom:6px;font-weight:600}

/* ---------- action bar ---------- */
.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--ink);color:#fff;padding:11px 22px;
  transform:translateY(105%);transition:transform .18s ease-out;
}
.actions.show{transform:none}
.ain{max-width:1500px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ain .btn{background:var(--kraft);border-color:var(--kraft);color:#1d1409}
.ain .btn:hover:not(:disabled){background:#c49c6b;border-color:#c49c6b}
.ain .btn.ghost{background:transparent;border-color:#4a5b6c;color:#cdd8e2}
.ain .btn.ghost:hover:not(:disabled){background:#243547}
.toast{
  position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(14px);
  background:var(--ok);color:#fff;padding:10px 18px;border-radius:3px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .2s;z-index:70;font-size:14px;
}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:820px){
  .hide-sm{display:none}
  input.dim{width:56px}
  main{padding:14px 12px 90px}
  .bar{padding:10px 12px}
}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>Case Dimension Review</h1>
    <div class="hsub" id="hsub"></div>
  </div>
  <div class="ruler"></div>
  <nav role="tablist">
    <button class="tab" role="tab" id="tab-issues" aria-selected="true" aria-controls="panel">Needs your eyes<span class="n" id="nIssues"></span></button>
    <button class="tab" role="tab" id="tab-clean" aria-selected="false" aria-controls="panel">Standardized<span class="n" id="nClean"></span></button>
    <button class="tab" role="tab" id="tab-fix" aria-selected="false" aria-controls="panel">VIP fix list<span class="n" id="nFix"></span></button>
    <button class="tab" role="tab" id="tab-mm" aria-selected="false" aria-controls="panel">Mismatches<span class="n" id="nMM"></span></button>
    <button class="tab" role="tab" id="tab-master" aria-selected="false" aria-controls="panel" style="display:none">Master</button>
    <button class="tab" role="tab" id="tab-pm" aria-selected="false" aria-controls="panel" style="display:none">Product master<span class="n" id="nPM"></span></button>
    <button class="tab" role="tab" id="tab-team" aria-selected="false" aria-controls="panel" style="display:none">Team</button>
    <button class="tab" role="tab" id="tab-my" aria-selected="false" aria-controls="panel" style="display:none">My tasks<span class="n" id="nMy"></span></button>
    <button class="tab" role="tab" id="tab-mydone" aria-selected="false" aria-controls="panel" style="display:none">Completed<span class="n" id="nMyDone"></span></button>
  </nav>
</header>

<div class="note">
  <div class="notein" id="topnote"></div>
</div>
<div class="bar">
  <div class="barin">
    <input type="search" id="q" placeholder="Search brand, description, or product ID" aria-label="Search">
    <select id="fPattern" aria-label="Filter by pattern"><option value="">All patterns</option></select>
    <select id="fScope" aria-label="Filter by scope">
      <option value="">All SKUs</option>
      <option value="noimg">Not imaged only</option>
      <option value="live">Active at all 7 warehouses</option>
      <option value="dead">Deleted at some warehouses</option>
      <option value="asis">Kept its own scan (no standard)</option>
      <option value="approved">Approved by you</option>
      <option value="corrected">Corrected automatically</option>
      <option value="vip">From VIP</option>
      <option value="scan">From scan consensus</option>
      <option value="own">Own scan only</option>
      <option value="voff">On the VIP fix list</option>
      <option value="cube">Fails the cube check — needs a tape</option>
      <option value="meas">Measured by you</option>
      <option value="wt">Fails the weight check — needs a scale</option>
      <option value="slim">Slim cans only</option>
      <option value="pd">Discontinued at some warehouses</option>
    </select>
    <button class="btn ghost" id="expandAll">Expand all</button>
    <button class="btn ghost" id="collapseAll">Collapse all</button>
    <span class="spacer"></span>
    <span class="count" id="shown"></span>
    <span id="userchip" style="font-size:12.5px;color:var(--ink-2);margin-right:6px"></span>
  <button class="btn ghost" id="syncOut" title="Download your measurements and claims as a small file to share with the team">Share session</button>
  <button class="btn ghost" id="syncIn" title="Load a teammate's session file — their measurements, claims and any mismatches appear here">Load teammate</button>
  <input type="file" id="syncFile" accept=".json" style="display:none">
  <button class="btn ghost" id="exportMy" style="display:none">Export my list</button>
  <button class="btn ghost" id="exportBtn">Export case list</button>
  <button class="btn ghost" id="exportRev">Export review list</button>
  <button class="btn ghost" id="exportFix">Export VIP fix list</button>
  </div>
</div>

<main id="panel" role="tabpanel"></main>

<div class="actions" id="actions">
  <div class="ain">
    <strong id="selCount" class="mono"></strong>
    <span id="selNote" style="color:#93a6b8;font-size:14px"></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="undoBtn" disabled>Undo last move</button>
    <button class="btn ghost" id="clearSel">Clear selection</button>
    <button class="btn" id="moveBtn">Move to verified</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<div id="loginwrap" style="display:none"><div class="box">
  <div id="sbLogin" style="display:none">
    <div style="font-weight:700;font-size:16px">Sign in</div>
    <input id="sbUser" placeholder="username or email" autocomplete="username" maxlength="60">
    <div class="pwwrap"><input id="sbPass" placeholder="password" type="password" autocomplete="current-password"><button type="button" class="eyebtn" data-eye="sbPass" aria-label="Show or hide the password"><svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-shut" style="display:none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
    <button class="btn" id="sbGo" style="width:100%">Sign in</button>
    <a href="#" id="sbForgot" style="display:block;font-size:12.5px;color:var(--blue);margin-top:10px">Forgot password?</a>
    <div id="sbErr" style="font-size:12px;color:var(--flag);margin-top:8px;min-height:15px"></div>
  </div>
  <div id="sbReset" style="display:none">
    <div style="font-weight:700;font-size:16px">Set a new password</div>
    <div style="font-size:13px;color:var(--ink-2);margin-top:4px">You followed the reset link — pick your new password.</div>
    <div class="pwwrap"><input id="sbNewPass" placeholder="new password" type="password" autocomplete="new-password"><button type="button" class="eyebtn" data-eye="sbNewPass" aria-label="Show or hide the password"><svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-shut" style="display:none" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button></div>
    <button class="btn" id="sbResetGo" style="width:100%">Save and sign in</button>
    <div id="sbResetErr" style="font-size:12px;color:var(--flag);margin-top:8px;min-height:15px"></div>
  </div>
  <div id="localLogin">
    <div style="font-weight:700;font-size:16px">Who&#39;s working?</div>
    <div style="font-size:13px;color:var(--ink-2);margin-top:4px">Your name goes on every measurement you make and on the cases you claim, so the team can see who did what.</div>
    <input id="loginName" placeholder="First name or initials" maxlength="24">
    <button class="btn" id="loginGo" style="width:100%">Work as Admin</button>
    <button class="btn ghost" id="loginUserBtn" style="width:100%;margin-top:8px">Work as Measurer</button>
  </div>

      showReset();   // nothing is verified until they click Save - mail scanners cannot spend the link

      for(let i=0;i<12;i++){
        const {data}=await sb.auth.getSession();
        if(data&&data.session){ok=true;break;}
        await new Promise(r=>setTimeout(r,400));
      }
      if(!ok){
        document.getElementById('sbReset').style.display='none';
        document.getElementById('sbLogin').style.display='';
        document.getElementById('sbErr').textContent='That reset link has expired or was already used — send a fresh one with Forgot password.';
        user=null; role=null; refreshUser();
      }
      try{history.replaceState(null,'',location.pathname);}catch(e){}
    } else {
      const {data}=await sb.auth.getSession();
      if(data&&data.session){ await resolveProfile(data.session.user); }
      else { user=null; role=null; refreshUser(); }
    }
    pullRemote();
    setInterval(pullRemote,60000);
  }catch(e){sbFailed=true;toast('Could not reach Supabase — working locally');}};

  const t=document.createElement('script');
  t.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';

}

    ]);
    if(t.data && JSON.stringify(t.data)!==JSON.stringify(team)){team=t.data; render();}
    const d={mlog:{},assign:{},claims:{}};
    (m.data||[]).forEach(r=>{(d.mlog[r.pid]=d.mlog[r.pid]||[]).push({wt:+r.wt,L:+r.l,W:+r.w,H:+r.h,by:r.by,src:r.src||null,user:r.usr,ts:+r.ts});});

    (c.data||[]).forEach(r=>{d.claims[r.pid]={user:r.usr,ts:+r.ts};});

}

function pushRemote(table,op,payload){
  if(!sb) return;
  const q= op==='insert'? sb.from(table).insert(payload)
        : op==='upsert'? sb.from(table).upsert(payload)
        : sb.from(table).delete().eq('pid',payload.pid);
  q.then(({error})=>{if(error&&!sbFailed){sbFailed=true;toast('Supabase write failed — changes are safe locally; check the policies');}});
}

function recordMeasure(pid,vals,by,src){
  const m={...vals,by,src:src||null,user:user||'unknown',ts:Date.now()};
  (mlog[pid]=mlog[pid]||[]).push(m);
  pushRemote('cds_measurements','insert',{pid,usr:m.user,ts:m.ts,wt:m.wt,l:m.L,w:m.W,h:m.H,by:m.by,src:m.src});
}
// mismatches: two people measured the same case and physics can't make them both right
function mismatches(){
  const out=[];
  for(const pid in mlog){
    const direct=mlog[pid].filter(m=>m.by==='measured');
    const byUser={}; direct.forEach(m=>byUser[m.user]=m);   // each person's latest word
    const us=Object.values(byUser);
    if(us.length<2) continue;
    const off=(f,t)=>Math.max(...us.map(m=>m[f]))-Math.min(...us.map(m=>m[f]))>t;
    const bad=['wt','L','W','H'].filter(f=>off(f,f==='wt'?Math.max(0.3,0.02*us[0].wt):0.25));
    if(bad.length){
      const r=clean.find(c=>c.pid===pid)||issues.find(c=>c.pid===pid);
      if(r) out.push({r,entries:us.sort((a,b)=>a.ts-b.ts),bad});
    }
  }
  return out;
}
let measEdit=null, recalcFor=null, recalcSel=new Set();
function famOf(r){return clean.filter(c=>c.pid!==r.pid && (c.sup||c.brand)===(r.sup||r.brand) && c.pack===r.pack);}
let recalcFields=new Set(['L','W','H']);   // weight opts in - formulas differ inside a family
function liqOf(pack){
  if(!pack) return null;
  let p=String(pack);
  let m=p.match(/^([2-6])\/(12|15|18|24|30)Z\b(.*)$/);
  if(m) p=(+m[1]*+m[2])+'/12Z'+m[3];
  m=p.match(/^(\d+)\/(\d+)\/([\d.]+)(Z|ML|L)\b/)||p.match(/^(\d+)\/([\d.]+)(Z|ML|L)\b/);
  if(!m) return null;
  let u,sz,un;
  if(m.length===5){u=+m[1]*+m[2];sz=+m[3];un=m[4];}else{u=+m[1];sz=+m[2];un=m[3];}
  const oz=un==='Z'?sz:un==='ML'?sz/29.574:sz*33.814;
  if(oz>68||u>40) return null;
  return {in3:u*oz*1.805, lb:u*oz*0.0651};
}
function measureSave(pid,vals){
  const r0=clean.find(c=>c.pid===pid);
  const liq=r0&&liqOf(r0.pack);
  if(liq){

    if(liq.in3>vol*0.80) toast('Heads up: this pack holds '+Math.round(liq.in3)+' in³ of liquid — a '+vals.L+' × '+vals.W+' × '+vals.H+' box can\'t. Saved anyway; worth a second look.');
    else if(vals.wt<liq.lb*0.95) toast('Heads up: the liquid alone weighs '+liq.lb.toFixed(1)+' lb — a '+vals.wt+' lb case can\'t hold it. Saved anyway; worth a second look.');
  }
  recordMeasure(pid,vals,'measured'); persistEdits(); measEdit=null;
  if(role==='user'){ recalcFor=null; toast('Measurement saved — nice work'); render(); return; }
  const r=clean.find(c=>c.pid===pid);
  const fam=r?famOf(r):[];
  recalcFields=new Set(['L','W','H']);
  if(fam.length){ recalcFor=pid; recalcSel=new Set(fam.map(f=>f.pid)); }
  else { recalcFor=null; toast('Measurement saved'); }
  render();
}
function recalcApply(pid,pids){
  const m=latest(pid); if(!m||!pids.length){recalcFor=null;render();toast('Kept to this case only');return;}
  const fields=[...recalcFields];
  if(!fields.length){toast('Pick at least one field to push');return;}
  pids.forEach(p=>{
    const r0=clean.find(c=>c.pid===p); const cur=latest(p)||r0;
    const vals={wt:cur.wt,L:cur.L,W:cur.W,H:cur.H};
    fields.forEach(f=>vals[f]=m[f]);
    recordMeasure(p,vals,'family',pid);
  });
  persistEdits(); recalcFor=null; render();
  toast(pids.length+' case'+(pids.length===1?'':'s')+' recalculated ('+fields.join(', ')+')');
}
function clearMeasure(pid){
  delete mlog[pid];
  clean.forEach(c=>{ const l=latest(c.pid); if(l && l.src===pid) delete mlog[c.pid]; });
  persistEdits(); measEdit=null; recalcFor=null; render(); toast('Back to the calculated standard');
}
const WAREHOUSES=['Milton','Mobile','Allstate','Birmingham','Huntsville','All locations'];
function allCases(){return clean.concat(issues);}
function caseOf(pid){return clean.find(c=>c.pid===pid)||issues.find(c=>c.pid===pid);}
function doneOf(pid){
  const a=assign[pid]; if(!a) return null;
  const m=(mlog[pid]||[]).find(x=>x.by==='measured'&&x.user===a.user&&x.ts>=a.ts);
  return m||null;
}
function knownUsers(){
  const u=new Set();
  team.forEach(t=>u.add(t.display||t.uname));
  Object.values(assign).forEach(a=>u.add(a.user));
  Object.values(mlog).forEach(a=>a.forEach(m=>u.add(m.user)));
  if(user) u.add(user);
  u.delete('unknown');
  return [...u].sort();
}
function homeLoc(name){
  const t=team.find(t=>(t.display||t.uname)===name||t.uname===name);
  return t&&t.loc||'';
}
let selection=new Set(), masterView='clean', pmView='assigned', pmLoc='', viewTab='issues';
function assignSelected(who,loc){
  if(!who){toast('Pick who this goes to');return;}
  let n=0;
  selection.forEach(pid=>{ assign[pid]={user:who,loc:loc||'',ts:Date.now()}; n++;
    pushRemote('cds_assignments','upsert',{pid,usr:who,loc:loc||'',ts:assign[pid].ts}); });
  selection.clear(); persistEdits(); render();
  toast(n+' case'+(n===1?'':'s')+' assigned to '+who);
}
function unassign(pid){delete assign[pid];pushRemote('cds_assignments','delete',{pid});persistEdits();render();}
function mergeState(d){
  let n=0;
  for(const pid in (d.mlog||{})){
    const have=new Set((mlog[pid]||[]).map(m=>m.user+'|'+m.ts));
    d.mlog[pid].forEach(m=>{if(!have.has(m.user+'|'+m.ts)){(mlog[pid]=mlog[pid]||[]).push(m);n++;}});
    if(mlog[pid]) mlog[pid].sort((a,b)=>a.ts-b.ts);
  }
  for(const pid in (d.claims||{})){
    if(!claims[pid]||d.claims[pid].ts>claims[pid].ts){claims[pid]=d.claims[pid];n++;}
  }
  for(const pid in (d.assign||{})){
    if(!assign[pid]||d.assign[pid].ts>assign[pid].ts){assign[pid]=d.assign[pid];n++;}
  }
  if(n) persistEdits();
  return n;
}
function toggleClaim(pid){
  const c=claims[pid];
  if(c && c.user===user){ delete claims[pid]; pushRemote('cds_claims','delete',{pid}); }
  else if(!c){ claims[pid]={user:user||'unknown',ts:Date.now()}; pushRemote('cds_claims','upsert',{pid,usr:claims[pid].user,ts:claims[pid].ts}); }
  else { toast(c.user+' is already working this one'); return; }
  persistEdits(); render();
}

/* ---- grouping ---- */
function group(rows){
  const b={};
  rows.forEach(r=>{ (b[r.brand] ||= {})[r.pack] ||= []; b[r.brand][r.pack].push(r); });
  return Object.keys(b).sort().map(brand=>({
    brand,
    packs:Object.keys(b[brand]).sort((p,q)=>{
      const oz=s=>{const m=String(s).match(/([\d.]+)\s*(Z|ML|L|GAL)\b/);
        if(!m) return 999;
        const v=parseFloat(m[1]);
        return m[2]==='Z'?v:m[2]==='ML'?v/29.574:v*33.814;};
      return (oz(p)-oz(q)) || p.localeCompare(q);
    }).map(pack=>({pack,rows:b[brand][pack].sort((x,y)=>x.desc.localeCompare(y.desc))}))
  }));
}
function matches(r){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q && !(r.desc.toLowerCase().includes(q)||r.brand.toLowerCase().includes(q)||String(r.pid).includes(q)||String(r.pack).toLowerCase().includes(q)||String(r.sup||'').toLowerCase().includes(q))) return false;
  const scope=document.getElementById('fScope').value;
  if(scope==='noimg' && r.img!=='No') return false;
  if(scope==='live' && r.dead) return false;
  if(scope==='dead' && !r.dead) return false;
  if(scope==='asis' && r.src!=='asis') return false;
  if(scope==='approved' && r.src!=='approved') return false;
  if(scope==='corrected' && r.src!=='corrected') return false;
  if(scope==='vip' && r.src!=='vip') return false;
  if(scope==='scan' && r.src!=='scan') return false;
  if(scope==='own' && r.src!=='own') return false;
  if(scope==='voff' && !r.voff) return false;
  if(scope==='cube' && !r.cube) return false;
  if(scope==='meas' && !edits[r.pid]) return false;
  if(scope==='wt' && !r.wflag) return false;
  if(scope==='slim' && r.can!=='12 slim') return false;
  if(scope==='pd' && !r.pd) return false;
  const p=document.getElementById('fPattern').value;
  if(p && viewTab==='issues' && r.pattern!==p) return false;
  return true;
}
function matchesFix(r){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(q && !(r.desc.toLowerCase().includes(q)||r.brand.toLowerCase().includes(q)||
     String(r.pid).includes(q)||String(r.pack).toLowerCase().includes(q)||
     String(r.sup||'').toLowerCase().includes(q))) return false;
  return true;
}

async function teamAdd(){
  const raw=document.getElementById('tmUser').value.trim().toLowerCase();
  const u=(raw.includes('@')?raw.split('@')[0]:raw).replace(/[^a-z0-9._-]/g,'');
  const email=raw.includes('@')?raw:(u+'@'+EMAIL_DOMAIN);
  const dp=document.getElementById('tmDisp').value.trim()||u;
  const pw=document.getElementById('tmPass').value;
  const rl=document.getElementById('tmRole').value;
  const lc=document.getElementById('tmLoc').value;
  const msg=document.getElementById('tmMsg');
  if(!u||pw.length<6){msg.textContent='Username plus a password of at least 6 characters.';return;}
  msg.textContent='Creating…';
  try{
    const temp=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false}});
    const {data,error}=await temp.auth.signUp({email,password:pw});
    if(error){msg.textContent=error.message.includes('already')?'They already have an account from one of your apps — they sign in with their existing password. If they are not in the list below, run the enrollment SQL.':'Could not create the account: '+error.message;return;}
    const uid=data.user&&data.user.id;
    if(uid) await sb.from('cds_roles').upsert({user_id:uid,uname:u,display:dp,role:rl,loc:lc});
    msg.textContent='';
    toast(dp+' can now sign in as "'+u+'" — hand them the password');
    await pullRemote(); render();
  }catch(e){msg.textContent='Could not reach Supabase.';}
}
async function teamRemove(uid,name,uname){
  if(!confirm('Remove '+name+' from the team? Their pending assignments are cleared too. Their sign-in account itself stays in Supabase.')) return;
  const {error}=await sb.from('cds_roles').delete().eq('user_id',uid);
  if(error){toast('Could not remove them — run the remove-permission SQL first');return;}
  for(const pid in assign){ if(assign[pid].user===name||assign[pid].user===uname){ delete assign[pid]; pushRemote('cds_assignments','delete',{pid}); } }
  persistEdits();
  toast(name+' removed from the team');
  await pullRemote(); render();
}

function svgBox(L,W,H,S,stroke,fill,top,side){
  const fw=L*S, fh=H*S, ox=W*S*0.45, oy=W*S*0.26;
  const w=fw+ox+8, h=fh+oy+8, x=4, y=4+oy;
  const p=(a)=>a.map(z=>z.map(n=>Math.round(n*10)/10).join(',')).join(' ');
  return `<svg viewBox="0 0 ${Math.ceil(w)} ${Math.ceil(h)}" width="${Math.ceil(w)}" height="${Math.ceil(h)}" role="img">
    <polygon points="${p([[x,y],[x+ox,y-oy],[x+fw+ox,y-oy],[x+fw,y]])}" fill="${top}" stroke="${stroke}" stroke-width="1"/>
    <polygon points="${p([[x+fw,y],[x+fw+ox,y-oy],[x+fw+ox,y+fh-oy],[x+fw,y+fh]])}" fill="${side}" stroke="${stroke}" stroke-width="1"/>
    <rect x="${x}" y="${y}" width="${Math.round(fw*10)/10}" height="${Math.round(fh*10)/10}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>
  </svg>`;
}

function canBadge(r){
  if(!r.can) return '';
  const slim=r.can==='12 slim';
  if(!slim) return '';
  return '<span class="badge slim" title="A slim 12 oz can is 6.13 in tall and 2.25 in across; a standard one is 4.83 by 2.60. Slim and standard cases are never averaged together.">slim can</span>';
}
function deadBadge(r){
  if(!r.dead||!r.dead.length) return '';
  const t=`Deleted at ${r.dead.join(', ')} — still active at the other warehouses, so it stays in the list.`;
  return `<span class="badge dead" title="${esc(t)}">deleted at ${r.dead.length} of 7</span>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function wire(){
  document.querySelectorAll('.bhead').forEach(h=>{
    const sec=h.closest('.brand'), b=sec.dataset.brand;
    const t=()=>{sec.classList.toggle('open');
      sec.classList.contains('open')?openBrands.add(b):openBrands.delete(b);
      h.setAttribute('aria-expanded',sec.classList.contains('open'));};
    h.onclick=t;
    h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t();}};
  });
  document.querySelectorAll('.pick').forEach(c=>{
    c.onchange=e=>{
      const pid=e.target.closest('tr').dataset.pid;
      e.target.checked?selected.add(pid):selected.delete(pid);
      e.target.closest('tr').classList.toggle('sel',e.target.checked);
      syncBar();
    };
  });
  wireMeasure();
  masterChrome(); roleBadges();
}
function roleBadges(){
  const asn=allCases().filter(c=>assign[c.pid]&&!doneOf(c.pid));
  document.getElementById('nPM').textContent=asn.length||'';
  if(user){
    document.getElementById('nMy').textContent=asn.filter(c=>assign[c.pid].user===user).length||'';
    document.getElementById('nMyDone').textContent=allCases().filter(c=>assign[c.pid]&&assign[c.pid].user===user&&doneOf(c.pid)).length||'';
  }
}
function wireMeasure(){
  document.querySelectorAll('[data-medit]').forEach(b=>{b.onclick=()=>{measEdit=b.dataset.medit;recalcFor=null;render();};});
  document.querySelectorAll('[data-mclaim]').forEach(b=>{b.onclick=()=>toggleClaim(b.dataset.mclaim);});
  document.querySelectorAll('[data-mfld]').forEach(c=>{c.onchange=()=>{c.checked?recalcFields.add(c.dataset.mfld):recalcFields.delete(c.dataset.mfld);};});
  document.querySelectorAll('[data-mcancel]').forEach(b=>{b.onclick=()=>{measEdit=null;render();};});
  document.querySelectorAll('[data-mclear]').forEach(b=>{b.onclick=()=>clearMeasure(b.dataset.mclear);});
  document.querySelectorAll('[data-msave]').forEach(b=>{b.onclick=()=>{
    const pid=b.dataset.msave, tr=b.closest('tr'), vals={};
    let ok=true;
    tr.querySelectorAll('input[data-mf]').forEach(i=>{
      const v=parseFloat(i.value);
      if(!(v>0)) ok=false; else vals[i.dataset.mf]=Math.round(v*100)/100;
    });
    if(!ok||Object.keys(vals).length!==4){toast('All four numbers are needed — weight, length, width, height');return;}
    measureSave(pid,vals);
  };});
  document.querySelectorAll('[data-msel]').forEach(c=>{c.onchange=()=>{c.checked?recalcSel.add(c.dataset.msel):recalcSel.delete(c.dataset.msel);};});
  document.querySelectorAll('[data-mall]').forEach(b=>{b.onclick=()=>recalcApply(b.dataset.mall, famOf(clean.find(x=>x.pid===b.dataset.mall)).map(f=>f.pid));});
  document.querySelectorAll('[data-msome]').forEach(b=>{b.onclick=()=>recalcApply(b.dataset.msome,[...recalcSel]);});
  document.querySelectorAll('[data-mskip]').forEach(b=>{b.onclick=()=>{recalcFor=null;render();toast('Kept to this case only');};});
  document.querySelectorAll('input.dim').forEach(i=>{
    i.oninput=e=>{
      const pid=e.target.closest('tr').dataset.pid, f=e.target.dataset.f;
      const r=issues.find(x=>x.pid===pid); if(!r) return;
      const v=e.target.value===''?null:parseFloat(e.target.value);
      r._edit[f]=v;
      const sug=r.sug[f];
      e.target.classList.toggle('edited', v!==null && (sug===null||sug===undefined||Math.abs(v-sug)>0.001));
      e.target.classList.toggle('suggested', v!==null && sug!==null && sug!==undefined && Math.abs(v-sug)<=0.001);
    };
  });
}
function syncBar(){
  const n=selected.size, a=document.getElementById('actions');
  a.classList.toggle('show',n>0||!!lastMove);
  document.getElementById('selCount').textContent=n?`${n} selected`:'';
  const anyEdit=[...selected].some(pid=>{const r=issues.find(x=>x.pid===pid);
    return r&&FIELDS.some(([k])=>r._edit[k]!==null&&r._edit[k]!==undefined&&(r.sug[k]===null||r.sug[k]===undefined||Math.abs(r._edit[k]-r.sug[k])>0.001));});
  document.getElementById('selNote').textContent=n?(anyEdit?'Includes dimensions you changed by hand.':'Using the suggested dimensions.'):'';
  document.getElementById('moveBtn').disabled=!n;
  document.getElementById('undoBtn').disabled=!lastMove;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);}

document.getElementById('moveBtn').onclick=()=>{
  const picked=issues.filter(r=>selected.has(r.pid));
  if(!picked.length) return;
  const moved=[];
  picked.forEach(r=>{
    const out={...r};
    let manual=false;
    FIELDS.forEach(([k])=>{
      const v=r._edit[k];
      if(v!==null&&v!==undefined&&!Number.isNaN(v)){
        if(r.sug[k]===null||r.sug[k]===undefined||Math.abs(v-r.sug[k])>0.001) manual=true;
        out[k]=v;
      }
    });
    out.status='clean'; out._moved=true; out._src=manual?'manual':'accepted';
    delete out.sug; delete out.off; delete out.pattern; delete out._edit;
    clean.push(out); moved.push(r.pid);
  });
  issues=issues.filter(r=>!selected.has(r.pid));
  lastMove={pids:moved,rows:picked};
  selected.clear();
  render(); syncBar(); counts(); persist();
  toast(`${moved.length} case${moved.length===1?'':'s'} moved to Verified`);
};
document.getElementById('undoBtn').onclick=()=>{
  if(!lastMove) return;
  clean=clean.filter(c=>!lastMove.pids.includes(c.pid));
  issues=issues.concat(lastMove.rows);
  const n=lastMove.pids.length; lastMove=null;
  render(); syncBar(); counts();
  toast(`${n} case${n===1?'':'s'} sent back to review`);
};
document.getElementById('clearSel').onclick=()=>{selected.clear();render();syncBar();};
document.getElementById('expandAll').onclick=()=>{
  document.querySelectorAll('.brand').forEach(s=>{s.classList.add('open');openBrands.add(s.dataset.brand);});};
document.getElementById('collapseAll').onclick=()=>{
  document.querySelectorAll('.brand').forEach(s=>s.classList.remove('open'));openBrands.clear();};
document.getElementById('exportMy').onclick=()=>{
  const mine=allCases().filter(c=>assign[c.pid]&&assign[c.pid].user===user);
  const rows=[['Product ID','Description','Brand','Pack','Location','Status','Current Weight','Current Length','Current Width','Current Height','My Weight','My Length','My Width','My Height','Completed']];
  mine.forEach(c=>{
    const a=assign[c.pid], d=doneOf(c.pid), v=latest(c.pid)||c;
    rows.push([c.pid,c.desc,c.brand,c.pack,a.loc||'',d?'Completed':'To measure',
      v.wt,v.L,v.W,v.H,
      d?d.wt:'',d?d.L:'',d?d.W:'',d?d.H:'',
      d?new Date(d.ts).toLocaleDateString():'']);
  });
  const csv=rows.map(r=>r.map(c=>{const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='my_measure_list.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast(mine.length+' task'+(mine.length===1?'':'s')+' exported');
};
document.getElementById('exportRev').onclick=()=>{
  const rows=[['Product ID','Description','Brand','Supplier','Pack','Scan Weight','Scan Length','Scan Width','Scan Height','What Is Wrong','Detail','Suggested Weight','Family Reference','Family Weight','Family Length','Family Width','Family Height']];
  issues.forEach(r=>rows.push([r.pid,r.desc,r.brand,r.sup||'',r.pack,r.wt,r.L,r.W,r.H,
    r.pattern,r.why||'',(r.sug&&r.sug.wt)!=null?r.sug.wt:'',
    r.ex?r.ex.desc:'',r.ex?r.ex.wt:'',r.ex?r.ex.L:'',r.ex?r.ex.W:'',r.ex?r.ex.H:'']));
  const csv=rows.map(r=>r.map(c=>{const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='review_list.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast(issues.length+' review cases exported');
};
document.getElementById('exportFix').onclick=()=>{
  const rows=[['Product ID','Description','Brand','Supplier','Pack','VIP Weight','Should Be Weight','VIP Length','VIP Width','VIP Height','Should Be Length','Should Be Width','Should Be Height','Why']];
  (DATA.vipfix||[]).forEach(r=>rows.push([r.pid,r.desc,r.brand,r.sup||'',r.pack,r.wtV??'',r.wtUse??'',r.vipL??'',r.vipW??'',r.vipH??'',r.useL,r.useW,r.useH,r.reason]));
  const csv=rows.map(r=>r.map(c=>{const s=c==null?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='vip_fix_list.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast((DATA.vipfix||[]).length+' VIP rows exported');
};
function refreshUser(){
  document.getElementById('userchip').innerHTML=user?`Signed in: <b>${esc(user)}</b> · <a href="#" id="switchUser" style="color:var(--blue)">switch</a>`:'';
  const sw=document.getElementById('switchUser');
  if(sw) sw.onclick=e=>{e.preventDefault();user=null;role=null;
    try{localStorage.removeItem('cds_user');localStorage.removeItem('cds_role');}catch(x){}
    if(sb){try{sb.auth.signOut();}catch(x){}}
    showLogin();};
  document.getElementById('loginwrap').style.display=user?'none':'flex';
}
function showLogin(){document.getElementById('loginwrap').style.display='flex';
  const i=document.getElementById(sb?'sbUser':'loginName'); if(i){i.value='';try{i.focus();}catch(e){}}
  const p=document.getElementById('sbPass'); if(p)p.value='';}
function signIn(v,r){
  if(!v){toast('A name is needed so measurements have an owner');return;}
  user=v; role=r; persistEdits(); applyRole(); refreshUser(); render();
}
document.getElementById('sbGo').onclick=()=>sbSignIn();
document.getElementById('sbForgot').onclick=e=>{e.preventDefault();sbForgotSend();};
document.getElementById('sbResetGo').onclick=()=>sbSetNewPassword();
document.getElementById('sbPass').onkeydown=e=>{if(e.key==='Enter')sbSignIn();};
document.getElementById('loginGo').onclick=()=>signIn(document.getElementById('loginName').value.trim(),'admin');
document.getElementById('loginUserBtn').onclick=()=>signIn(document.getElementById('loginName').value.trim(),'user');
document.getElementById('loginName').onkeydown=e=>{if(e.key==='Enter')document.getElementById('loginGo').onclick();};
function applyRole(){
  const admin=role==='admin';
  ['tab-issues','tab-clean','tab-fix','tab-mm'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('tab-master').style.display=admin?'':'none';
  document.getElementById('tab-pm').style.display=admin?'':'none';
  document.getElementById('tab-team').style.display=(admin&&SUPABASE_KEY)?'':'none';
  document.getElementById('tab-my').style.display=admin?'none':'';
  document.getElementById('tab-mydone').style.display=admin?'none':'';
  ['exportBtn','exportRev','exportFix'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=admin?'':'none';});
  document.getElementById('exportMy').style.display=admin?'none':'';
  const live=!!(SUPABASE_URL&&SUPABASE_KEY);   // session files were the pre-database sync; the database made them clutter
  ['syncOut','syncIn'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=(admin&&!live)?'':'none';});
  tab=admin?'master':'my';
  ['tab-master','tab-pm','tab-my','tab-mydone'].forEach(id=>document.getElementById(id).setAttribute('aria-selected',false));
  document.getElementById(admin?'tab-master':'tab-my').setAttribute('aria-selected',true);
}
document.getElementById('syncOut').onclick=()=>{
  const payload=JSON.stringify({v:2,user,mlog,claims,assign,at:Date.now()});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));
  a.download='cds_session_'+(user||'anon')+'.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('Session saved — send the file to a teammate or the host machine');
};
document.getElementById('syncIn').onclick=()=>document.getElementById('syncFile').click();
document.getElementById('syncFile').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    const n=mergeState(d);
    persistEdits(); render();
    const mm=mismatches().length;
    toast(n+' measurement'+(n===1?'':'s')+' loaded from '+(d.user||'teammate')+(mm?' — '+mm+' mismatch'+(mm===1?'':'es')+' to look at':''));
  }catch(err){toast('That file could not be read');}
  e.target.value='';};
  rd.readAsText(f);
};
document.getElementById('exportBtn').onclick=()=>{
  const rows=[['Status','Product ID','Description','Brand','Pack','Weight','Length','Width','Height','Supplier','Pattern']];
  clean.forEach(r0=>{const e=edits[r0.pid];const r=e?{...r0,wt:e.wt,L:e.L,W:e.W,H:e.H}:r0;
    rows.push([e?(e.by==='measured'?'Measured by '+e.user:'Set from '+e.user+"'s measurement"):({standard:'Standardized',asis:'Own scan (no standard)',approved:'Approved by you',corrected:'Corrected automatically'}[r.src]||'Standardized'),r.pid,r.desc,r.brand,r.pack,r.wt,r.L,r.W,r.H,r._moved?(r._src==='manual'?'Manual entry':'Accepted suggestion'):'Original scan','']);});
  issues.forEach(r=>rows.push(['Needs your eyes',r.pid,r.desc,r.brand,r.pack,r.wt,r.L,r.W,r.H,r.sup||'',r.pattern]));
  (DATA.removed||[]).forEach(r=>rows.push(['Discontinued - removed',r.pid,r.desc,r.brand,r.pack,r.wt,r.L,r.W,r.H,'Original scan',
    'Deleted at '+(r.delwh||[]).join(' / ')]));
  const csv=rows.map(r=>r.map(c=>{const s=c===null||c===undefined?'':String(c);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='case_dimensions.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
};
['tab-issues','tab-clean','tab-fix','tab-mm','tab-master','tab-pm','tab-my','tab-mydone','tab-team'].forEach(id=>{
  document.getElementById(id).onclick=()=>{
    tab={'tab-issues':'issues','tab-clean':'clean','tab-fix':'fix','tab-mm':'mm','tab-master':'master','tab-pm':'pm','tab-my':'my','tab-mydone':'mydone','tab-team':'team'}[id];
    ['tab-master','tab-pm','tab-my','tab-mydone','tab-team'].forEach(t=>document.getElementById(t).setAttribute('aria-selected',t===id));
    document.getElementById('tab-issues').setAttribute('aria-selected',tab==='issues');
    document.getElementById('tab-clean').setAttribute('aria-selected',tab==='clean');
    document.getElementById('tab-fix').setAttribute('aria-selected',tab==='fix');
    document.getElementById('tab-mm').setAttribute('aria-selected',tab==='mm');
    document.getElementById('fPattern').style.display=tab==='issues'?'':'none';
    document.getElementById('fScope').style.display=tab==='fix'?'none':'';
    openBrands.clear(); render(); syncBar();
  };
});
['q','fPattern','fScope'].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener(id==='q'?'input':'change',()=>render());
});
function counts(){
  document.getElementById('nIssues').textContent=issues.length;
  document.getElementById('nClean').textContent=clean.length;
  document.getElementById('nFix').textContent=(DATA.vipfix||[]).length;
  const nd=(DATA.removed||[]).length;
  const std=clean.filter(c=>c.src==='standard').length, asis=clean.filter(c=>c.src==='asis').length,
        appr=clean.filter(c=>c.src==='approved').length,
        corr=clean.filter(c=>c.src==='corrected').length,
        vp=clean.filter(c=>c.src==='vip').length,
        scn=clean.filter(c=>c.src==='scan').length,
        own=clean.filter(c=>c.src==='own').length,
        voff=(DATA.vipfix||[]).length;
  document.getElementById('hsub').textContent=
    `${issues.length+clean.length} active cases · ${vp} from VIP · ${scn} from scan consensus · ${own} own scan only · ${Object.keys(edits).length} measured by you · ${voff} on the VIP fix list`;
  const tn=document.getElementById('topnote'); tn.textContent=''; tn.style.display='none';
  const _old2=()=>
    'VIP is the source of truth wherever it holds up: a VIP number backed by a sibling VIP row, or by the scan consensus, sets the whole group — same supplier and pack means one box. '
    + 'Lengths and widths are normalized so length is the longer side, which quietly fixes the miskeyed entries. '
    + `Where VIP is silent (${asis+std} cases), the middle of the group's scans fills in — single scans are noisy, but twenty of them agreeing are not. `
    + `${voff} VIP rows read differently from what their own siblings agree on; they carry a "VIP miskey?" badge and a filter, worth fixing in the system when convenient.`;
  const _oldnote=()=>
    'Every case with siblings to compare against is already set to its group standard — same brand and pack means identical dimensions, '
    + `rounded to the nearest 1/8 in. ${asis} cases had nothing to compare against and kept their own scan. `
    + `${corr} cases that were clearly wrong were corrected outright rather than queued, because the standard behind them was backed by enough agreeing cases that there was nothing to decide — your earlier approvals are among them and now carry the current standard. `
    + 'Brand and supplier come from your product master, not from parsing descriptions. A 12 oz can comes slim or standard and the pack string does not say which, so each case is sorted by its can body first and the two are never averaged together. '
    + '431 cases discontinued at every warehouse were dropped. '
    + `Only the ${issues.length} below sit far enough outside any standard that scan noise cannot explain them. `
    + 'Length is the longer side. 44 discontinued cases were removed.';
}
(function init(){
  const pats=[...new Set(DATA.issues.map(r=>r.pattern))].sort();
  const sel=document.getElementById('fPattern');
  pats.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o);});
  const setTops=()=>{
    const h=document.querySelector('header').offsetHeight;
    const nh=document.querySelector('.note').offsetHeight;
    document.documentElement.style.setProperty('--barTop',(h+nh)+'px');
    document.documentElement.style.setProperty('--brandTop',(h+nh+document.querySelector('.bar').offsetHeight)+'px');
  };
  setTops(); window.addEventListener('resize',setTops);
  counts(); if(role&&user) applyRole(); render(); refreshUser(); roleBadges(); initSupabase(); syncBar();
})();
</script>
